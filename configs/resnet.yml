# 数据集参数
dataset_conf:
  dataset:
    # 过滤最短的音频长度
    min_duration: 0.4
    # 最长的音频长度，大于这个长度会裁剪掉
    max_duration: 5
    # 音频的采样率
    sample_rate: 16000
    # 是否对音频进行音量归一化
    use_dB_normalization: True
    # 对音频进行音量归一化的音量分贝值
    target_dB: -20
    # 归一化文件路径，设为空则不使用归一化
    scaler_path: ''
  dataLoader:
    # 训练的批量大小
    batch_size: 32
    # 是否丢弃最后一个样本
    drop_last: True
    # 读取数据的线程数量
    num_workers: 4
  # 训练数据的数据列表路径
  train_list: 'dataset/train_list.txt'
  # 测试数据的数据列表路径
  test_list: 'dataset/test_list.txt'
  # 标签列表
  label_list_path: 'dataset/label_list.txt'
  # 评估的数据要特殊处理
  eval_conf:
    # 评估的批量大小
    batch_size: 1
    # 最长的音频长度
    max_duration: 10

# 数据预处理参数
preprocess_conf:
  # 音频预处理方法，支持：MelSpectrogram、MFCC、Emotion2Vec、Wav2Vec2
  feature_method: 'MelSpectrogram'
  method_args:
    # Mel频谱参数
    n_mels: 128
    n_fft: 2048
    hop_length: 512
    win_length: 2048
    fmin: 50
    fmax: 8000

model_conf:
  # 所使用的模型：SERResNet18、SERResNet34、SERResNet50、TransformerSER
  model: 'SERResNet18'
  # 模型参数
  model_args:
    # 分类大小，如果为null，自动通过标签列表获取
    num_class: null
    # 基础通道数
    base_channels: 64

optimizer_conf:
  # 优化方法：Adam、AdamW、SGD
  optimizer: 'AdamW'
  # 优化方法参数
  optimizer_args:
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  # 学习率衰减函数
  scheduler: 'CosineAnnealingWarmRestarts'
  # 学习率衰减函数参数
  scheduler_args:
    T_0: 10
    T_mult: 2
    eta_min: !!float 1e-6

train_conf:
  # 是否开启自动混合精度
  enable_amp: True
  # 是否使用Pytorch2.0的编译器
  use_compile: False
  # CrossEntropyLoss类的label_smoothing参数
  label_smoothing: 0.1
  # 训练的轮数
  max_epoch: 100
  # 日志打印间隔
  log_interval: 10
  # 早停耐心值
  early_stopping_patience: 20
  # 梯度裁剪
  gradient_clip_norm: 1.0
  # warmup步数
  warmup_steps: 1000