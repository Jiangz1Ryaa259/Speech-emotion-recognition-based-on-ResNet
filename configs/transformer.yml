# Transformer模型配置
model_conf:
  model: 'TransformerSER'
  model_args:
    num_class: null
    hidden_size: 256
    nhead: 8
    num_layers: 4
    dropout: 0.1

optimizer_conf:
  optimizer: 'AdamW'
  optimizer_args:
    lr: !!float 5e-5
    weight_decay: !!float 1e-2
    betas: [0.9, 0.999]

train_conf:
  enable_amp: True
  use_compile: False
  label_smoothing: 0.1
  max_epoch: 80
  log_interval: 10
  gradient_clip_norm: 1.0
  warmup_steps: 500