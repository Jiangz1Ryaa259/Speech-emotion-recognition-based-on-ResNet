# 数据集参数
dataset_conf:
  dataset:
    min_duration: 0.4
    max_duration: 5
    sample_rate: 16000
    use_dB_normalization: True
    target_dB: -20
    scaler_path: ''
  dataLoader:
    batch_size: 16
    drop_last: True
    num_workers: 0
  train_list: 'dataset/train_list.txt'
  test_list: 'dataset/test_list.txt'
  label_list_path: 'dataset/label_list.txt'
  eval_conf:
    batch_size: 1
    max_duration: 10

# 数据预处理参数 - 使用Emotion2Vec预训练特征
preprocess_conf:
  feature_method: 'Emotion2Vec'
  method_args:
    layer: 12
    layer_norm: True
    feature_size: 768

model_conf:
  model: 'TransformerSER'
  model_args:
    num_class: 8
    hidden_size: 256
    nhead: 8
    num_layers: 4
    dropout: 0.1

optimizer_conf:
  optimizer: 'AdamW'
  optimizer_args:
    lr: !!float 2e-5
    weight_decay: !!float 1e-2
  scheduler: 'CosineAnnealingWarmRestarts'
  scheduler_args:
    T_0: 10
    T_mult: 2
    eta_min: !!float 1e-7

train_conf:
  enable_amp: True
  use_compile: False
  label_smoothing: 0.1
  max_epoch: 50
  log_interval: 5
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  warmup_steps: 500